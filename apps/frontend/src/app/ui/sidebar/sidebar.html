<div class="group">
  <button [routerLink]="['/']">{{ 'common.overview' | i18n | async }}</button>
  <button (click)="openSearch()">{{ 'sidebar.searchChat' | i18n | async }}</button>
  <button [routerLink]="['settings']">{{ 'common.settings' | i18n | async }}</button>
  <button [routerLink]="['docs']">{{ 'common.documentation' | i18n | async }}</button>
</div>

<section class="sidebar-section">
  <app-accordion [title]="'sidebar.folders' | i18n | async">
    <div class="folder-list">
      @for (folder of fodlers$ | async; track folder.id) {
        <button
          class="folder"
          [title]="folder.name || ('common.untitled' | i18n | async)"
          [routerLink]="['folder', folder.id]"
          (contextmenu)="openFolderMenu($event, folder.id)"
          dropTarget
          [dropTargetEnabled]="true"
          [dropTargetData]="folder"
          [dropTargetData]="folder"
          [dropTargetGroup]="'chats'"
        >
          <app-icon name="folder-line"></app-icon>
          {{ folder.name || ('common.untitled' | i18n | async) }}
        </button>
      }
    </div>
  </app-accordion>
  <button
    class="addBtn"
    [title]="'sidebar.createFolder' | i18n | async"
    (click)="createNewFolder()"
  >
    <app-icon name="add-line" />
  </button>
</section>

<section class="sidebar-section">
  <app-accordion [title]="'sidebar.chats' | i18n | async">
    <div
      class="chat-list"
      dropContainer
      [dropGroup]="'chats'"
      [containerId]="'chat-list'"
      (itemDropped)="onChatReorder($event)"
      (itemDroppedOnTarget)="onChatDroppedIntoFolder($event)"
    >
      @for (chat of chats$ | async; track chat.id) {
        <button
          class="chats"
          [title]="chat.title || ('common.untitled' | i18n | async)"
          [routerLink]="['chat', chat.id]"
          (contextmenu)="openChatMenu($event, chat.id)"
          dragItem
          [dragData]="chat"
        >
          <app-icon name="chat-4-line"></app-icon>
          <span>{{ chat.title || ('common.untitled' | i18n | async) }}</span>
        </button>
      }
    </div>
  </app-accordion>
  <button class="addBtn" [title]="'sidebar.addChat' | i18n | async" (click)="createNewChat()">
    <app-icon name="add-line" />
  </button>
</section>

<section class="sidebar-section">
  <app-accordion [title]="'sidebar.workflows' | i18n | async">
    <div
      class="workflow-list"
      dropContainer
      [dropGroup]="'workflows'"
      [containerId]="'workflow-list'"
      (itemDropped)="onChatReorder($event)"
      (itemDroppedOnTarget)="onChatDroppedIntoFolder($event)"
    >
      @for (w of workflows$ | async; track w.id) {
        <button
          class="workflow"
          [title]="w.title || ('common.untitled' | i18n | async)"
          [routerLink]="['workflow', w.id]"
          (contextmenu)="openWorkflowMenu($event, w.id)"
          dragItem
          [dragData]="w"
        >
          <app-icon name="flow-chart"></app-icon>
          <span>{{ w.name || ('common.untitled' | i18n | async) }}</span>
        </button>
      }
    </div>
  </app-accordion>
  <button
    class="addBtn"
    [title]="'sidebar.addWorkflow' | i18n | async"
    (click)="createNewWorkflow()"
  >
    <app-icon name="add-line" />
  </button>
</section>

@let ext = external$ | async;

<div class="sidebar-footer">
  <div class="service-status" [title]="'LM Studio'">
    <span class="dot" [class]="externalStatusDot(ext?.['lmstudio'] ?? null)"></span>
    <span class="label">LM Studio</span>
  </div>
  <div class="service-status" [title]="'SearXNG'">
    <span class="dot" [class]="externalStatusDot(ext?.['searxng'] ?? null)"></span>
    <span class="label">SearXNG</span>
  </div>
</div>

@if (menu().open) {
  <app-context-menu
    [position]="menu().pos"
    [context]="menu().chatId"
    [items]="
      menuType === 'chat'
        ? chatMenuItems
        : menuType === 'folder'
          ? folderMenuItems
          : workflowMenuItems
    "
    (close)="closeMenu()"
  />
}

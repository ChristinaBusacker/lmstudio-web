<div class="page">
  <header class="header">
    <div class="title">{{ 'settings.title' | i18n | async }}</div>

    <nav class="tabs">
      <button class="tab" [class.active]="tab === 'profiles'" (click)="setTab('profiles')">
        {{ 'settings.tab.profiles' | i18n | async }}
      </button>
      <button class="tab" [class.active]="tab === 'models'" (click)="setTab('models')">
        {{ 'settings.tab.models' | i18n | async }}
      </button>
      <button class="tab" [class.active]="tab === 'user'" (click)="setTab('user')">
        {{ 'settings.tab.userPreferences' | i18n | async }}
      </button>
    </nav>
  </header>

  <section class="status">
    @if (loading$ | async) {
      <div class="pill">{{ 'common.loading' | i18n | async }}</div>
    }

    @if (error$ | async; as err) {
      <div class="error">
        <div class="error-text">{{ err }}</div>
        <button class="btn btn-ghost" (click)="clearError()">
          {{ 'common.dismiss' | i18n | async }}
        </button>
      </div>
    }

    @if (tab === 'profiles') {
      <div class="grid">
        <aside class="panel">
          <app-profiles-sidebar
            [profiles]="profiles$ | async"
            [selectedId]="selectedId"
            (reload)="reload()"
            (selectId)="selectProfile($event)"
            (create)="createProfile($event)"
            (setDefaultId)="setDefault($event)"
            (deleteProfileId)="deleteProfile($event)"
          />
        </aside>

        <main class="panel">
          <app-profile-editor
            [profile]="selected$ | async"
            [models]="models$ | async"
            [modelsLoading]="modelsLoading$ | async"
            [isModelBusyFn]="isModelBusy.bind(this)"
            [isModelLoadedFn]="isModelLoaded.bind(this)"
            (save)="saveProfile($event.id, $event.patch)"
            (setDefaultId)="setDefault($event)"
            (loadModelId)="loadModel($event)"
            (unloadModelId)="unloadModel($event)"
          />
        </main>
      </div>
    } @else if (tab === 'models') {
      <div class="panel">
        <app-models-panel
          [models]="models$ | async"
          [loading]="modelsLoading$ | async"
          [isBusyFn]="isModelBusy.bind(this)"
          (loadModelId)="loadModel($event)"
          (unloadModelId)="unloadModel($event)"
          (reloadModels)="reloadModels()"
        />
      </div>
    } @else {
      <div class="panel">
        <app-user-preferences />
      </div>
    }
  </section>
</div>

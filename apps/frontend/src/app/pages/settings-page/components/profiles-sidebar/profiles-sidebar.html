<h2>{{ 'profiles.title' | i18n | async }}</h2>

<div class="card">
  <div class="row row-top">
    <div class="card-title">{{ 'profiles.list' | i18n | async }}</div>

    <div class="list-controls">
      <input
        class="input input-small"
        type="text"
        [value]="filter()"
        (input)="onFilterInput($event.target.value ?? '')"
        [placeholder]="'common.filter' | i18n | async"
      />

      <button
        class="btn btn-icon"
        (click)="reload.emit()"
        [attr.title]="'common.reload' | i18n | async"
        [attr.aria-label]="'common.reload' | i18n | async"
      >
        <app-icon name="refresh-line" />
      </button>
    </div>
  </div>

  @if (profiles() === null) {
    <div class="empty">{{ 'common.loading' | i18n | async }}</div>
  } @else if (filteredProfiles().length === 0) {
    <div class="empty">{{ 'profiles.none' | i18n | async }}</div>
    <button class="btn btn-primary" (click)="onCreate()">
      {{ 'profiles.create' | i18n | async }}
    </button>
  } @else {
    <div class="list">
      @for (p of filteredProfiles(); track p.id) {
        <button
          class="list-item"
          [class.active]="p.id === selectedId()"
          (click)="selectProfile(p.id)"
        >
          <div class="row">
            <div class="name">
              {{ p.name }}

              @if (p.isDefault) {
                <span class="badge">{{ 'common.default' | i18n | async }}</span>
              }
            </div>
            <div class="id">{{ p.id }}</div>
          </div>

          <div class="row row-actions">
            <button
              class="btn btn-ghost"
              type="button"
              (click)="$event.stopPropagation(); setDefaultId.emit(p.id)"
              [disabled]="p.isDefault"
            >
              {{ 'profiles.setDefault' | i18n | async }}
            </button>

            <button
              class="btn btn-warn"
              type="button"
              (click)="$event.stopPropagation(); deleteProfileId.emit(p.id)"
              [disabled]="p.isDefault"
            >
              {{ 'profiles.delete' | i18n | async }}
            </button>
          </div>
        </button>
      }

      <button class="btn btn-primary" (click)="onCreate()">
        {{ 'profiles.create' | i18n | async }}
      </button>
    </div>
  }
</div>
